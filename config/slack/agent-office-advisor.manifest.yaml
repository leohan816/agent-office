# Socket Mode app-level token requirement (owner-created, never committed): connections:write only.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Agent Office Advisor Pilot
  description: Private Socket Mode transport for the Agent Office Advisor pilot
  background_color: "#172554"
features:
  bot_user:
    display_name: Agent Office Advisor
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
