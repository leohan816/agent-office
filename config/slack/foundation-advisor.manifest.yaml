# Socket Mode app-level token requirement (owner-created, never committed): connections:write only.
_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Foundation Advisor Pilot
  description: Private Socket Mode transport for the Foundation Advisor pilot
  background_color: "#14532D"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: false
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Foundation Advisor
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:history
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
