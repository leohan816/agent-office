<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 1040 760" font-family="'Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
  <title>A-1R — Foundation Advisor Team Pod detail (role anchors, furniture depth, Mission Board) — re-laid-out, no collisions</title>
  <defs>
    <linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe7db"/><stop offset="1" stop-color="#e4dccb"/></linearGradient>
    <linearGradient id="pp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe8f2"/><stop offset="1" stop-color="#c5d5ea"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3b075"/><stop offset="1" stop-color="#bf9a5c"/></linearGradient>
    <style>
      .h{font-size:20px;font-weight:700;fill:#2c2a26}.sub{font-size:12px;fill:#6b6459}
      .anch{font-size:11.5px;font-weight:700;fill:#234b78}.name{font-size:12px;font-weight:700;fill:#2c2a26}
      .team{font-size:10px;font-weight:600;fill:#5c554a}.state{font-size:11px;font-weight:700}
      .mbh{font-size:12px;font-weight:700;fill:#2c2a26}.mb{font-size:11px;fill:#3a352c}
      .cap{font-size:11px;fill:#4a443a}.tiny{font-size:10px;fill:#8a8072}
    </style>
    <!-- small angled desk+monitor unit (kept compact so it never sits under a label) -->
    <g id="unit">
      <polygon points="0,20 74,20 84,44 -10,44" fill="url(#desk)"/><polygon points="74,20 84,44 84,49 74,25" fill="#a07f45"/>
      <rect x="22" y="1" width="34" height="20" rx="3" fill="#3a3f47"/><rect x="25" y="4" width="28" height="14" rx="2" fill="#5b7fa6"/>
    </g>
    <!-- actor head+torso (compact) -->
    <g id="figA"><circle cx="0" cy="0" r="8" fill="#e9c9a0"/><rect x="-9" y="8" width="18" height="15" rx="5" fill="#7a4b8c"/></g>
    <g id="figC"><circle cx="0" cy="0" r="8" fill="#e9c9a0"/><rect x="-9" y="8" width="18" height="15" rx="5" fill="#3d3a34"/></g>
    <g id="figW"><circle cx="0" cy="0" r="8" fill="#e9c9a0"/><rect x="-9" y="8" width="18" height="15" rx="5" fill="#2f6db0"/></g>
    <g id="figR"><circle cx="0" cy="0" r="8" fill="#e9c9a0"/><rect x="-9" y="8" width="18" height="15" rx="5" fill="#4a4a4a"/></g>
  </defs>
  <rect width="1040" height="760" fill="url(#pw)"/>
  <text x="28" y="36" class="h">Foundation Advisor Team Pod — 상세</text>
  <text x="28" y="56" class="sub">한 층 위 하나의 Pod · 역할별 고유 앵커 · 근접이 권한을 만들지 않음 · 45° 3/4 · 정사각/다이아 타일 · 라벨·실루엣·가구 비겹침</text>

  <!-- pod platform -->
  <g transform="translate(40,72)">
    <polygon points="0,44 900,44 956,660 -44,660" fill="url(#pp)" stroke="#7ba0cc" stroke-width="2.5"/>
    <g stroke="#a6c0e0" stroke-width="1" opacity="0.5">
      <line x1="150" y1="44" x2="130" y2="660"/><line x1="310" y1="44" x2="300" y2="660"/><line x1="470" y1="44" x2="480" y2="660"/><line x1="630" y1="44" x2="660" y2="660"/><line x1="790" y1="44" x2="840" y2="660"/>
      <line x1="-8" y1="220" x2="924" y2="220"/><line x1="-22" y1="400" x2="938" y2="400"/><line x1="-36" y1="560" x2="952" y2="560"/>
    </g>
    <rect x="0" y="0" width="440" height="32" rx="7" fill="#2f6db0"/>
    <text x="14" y="22" font-size="14" font-weight="700" fill="#fff">◆ Foundation Advisor Team · FND</text>

    <!-- ===== Column A (left): Mission Board (top) + Reviewer booth (bottom) ===== -->
    <!-- ① Advisor Mission Board + coordination desk -->
    <g transform="translate(16,52)">
      <text x="0" y="0" class="anch">① Advisor · 조정 데스크 + Team Mission Board</text>
      <rect x="0" y="8" width="300" height="150" rx="10" fill="#f7fafd" stroke="#8fb0d6" stroke-width="1.5"/>
      <rect x="0" y="8" width="300" height="24" rx="10" fill="#dce9f7"/><text x="12" y="25" class="mbh">Team Mission Board · Foundation</text>
      <text x="12" y="52" class="mb">Team/프로젝트 · Foundation</text>
      <text x="12" y="72" class="mb">현재 미션 · A-1R Living Office 리파인먼트</text>
      <text x="12" y="92" class="mb">진행 · 미확정 (WU 승인 후 정의) · 상태 · <tspan fill="#b8791c" font-weight="700">대기 · Leo 승인</tspan></text>
      <text x="12" y="112" class="mb">차단 · 없음 · Leo 결정 · 정적 목업 승인 대기</text>
      <text x="12" y="132" class="mb">다음 · 독립 설계 검토 → Leo 승인</text>
      <text x="12" y="150" class="tiny">KST 검증 · — (검증 UTC 원천 시) · 미확인은 미확인(날조 금지)</text>
    </g>
    <g transform="translate(120,224)">
      <use href="#unit"/><use href="#figA" x="37" y="-8"/>
      <g transform="translate(-40,52)"><rect width="176" height="42" rx="8" fill="#fff" stroke="#8fb0d6"/><circle cx="17" cy="16" r="9" fill="#7a4b8c"/><text x="17" y="20" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">A</text><text x="34" y="15" class="name">Foundation Advisor</text><text x="34" y="30" class="team">Advisor · FND</text><text x="134" y="30" class="state" fill="#2f8f4e">● 진행 중</text></g>
    </g>

    <!-- ④ Reviewer independent booth/zone (bottom-left, clear of Advisor) -->
    <g transform="translate(8,360)">
      <text x="8" y="0" class="anch">④ Reviewer · 독립 부스/구역</text>
      <rect x="0" y="10" width="270" height="176" rx="12" fill="#f4f1ea" stroke="#b7ae9c" stroke-dasharray="6 4" stroke-width="1.5"/>
      <text x="14" y="30" class="tiny">경계 구획 · 근접이 승인을 의미하지 않음</text>
      <g transform="translate(112,64)"><use href="#unit"/><use href="#figR" x="37" y="-8"/></g>
      <g transform="translate(46,124)"><rect width="176" height="42" rx="8" fill="#fff" stroke="#c9c2b4"/><circle cx="17" cy="16" r="9" fill="#4a4a4a"/><text x="17" y="20" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">R</text><text x="34" y="15" class="name">Independent Reviewer</text><text x="34" y="30" class="team">Reviewer · FND</text><text x="128" y="30" class="state" fill="#6b6459">◦ 대기</text></g>
    </g>

    <!-- ===== Column B (center): Control (top) + SIASIU Worker (bottom) ===== -->
    <!-- ② Control architecture/design surface -->
    <g transform="translate(346,52)">
      <text x="0" y="0" class="anch">② Control · 아키텍처/설계 표면</text>
      <rect x="0" y="8" width="150" height="64" rx="8" fill="#eef1f5" stroke="#b7c4d6"/><text x="10" y="26" class="tiny">아키텍처/설계 보드</text>
      <line x1="12" y1="36" x2="140" y2="36" stroke="#c4cfe0"/><line x1="12" y1="47" x2="120" y2="47" stroke="#c4cfe0"/><rect x="12" y="53" width="58" height="11" rx="2" fill="#c9d6e8"/><rect x="78" y="53" width="40" height="11" rx="2" fill="#dbe4f0"/>
      <g transform="translate(28,92)"><use href="#unit"/><use href="#figC" x="37" y="-8"/></g>
      <g transform="translate(-6,144)"><rect width="184" height="42" rx="8" fill="#fff" stroke="#c9c2b4"/><circle cx="17" cy="16" r="9" fill="#3d3a34"/><text x="17" y="20" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">C</text><text x="34" y="15" class="name">Foundation Control</text><text x="34" y="30" class="team">Control · FND</text><text x="128" y="30" class="state" fill="#6b6459">◦ 상태 불명</text></g>
    </g>
    <!-- SIASIU Worker -->
    <g transform="translate(346,300)">
      <use href="#unit" transform="translate(40,0)"/><use href="#figW" x="77" y="-8"/>
      <g transform="translate(0,52)"><rect width="184" height="42" rx="8" fill="#fff" stroke="#e0b6a9"/><circle cx="17" cy="16" r="9" fill="#2f6db0"/><text x="17" y="20" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">W</text><text x="34" y="15" class="name">SIASIU Worker</text><text x="34" y="30" class="team">Worker · FND</text><text x="140" y="30" class="state" fill="#c0392b">■ 차단됨</text></g>
    </g>

    <!-- ===== Column C (right): Workers Agent Office (top) + Cosmile (mid) + idle/Channy (bottom) ===== -->
    <g transform="translate(660,52)">
      <text x="0" y="0" class="anch">③ Worker · 개인 데스크</text>
      <text x="0" y="16" class="tiny">(Agent Office는 Foundation 소속 · 별도 Pod 아님)</text>
    </g>
    <!-- Agent Office Worker -->
    <g transform="translate(680,96)">
      <use href="#unit"/><use href="#figW" x="37" y="-8"/>
      <g transform="translate(-30,52)"><rect width="184" height="42" rx="8" fill="#fff" stroke="#c9c2b4"/><circle cx="17" cy="16" r="9" fill="#2f6db0"/><text x="17" y="20" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">W</text><text x="34" y="15" class="name">Agent Office Worker</text><text x="34" y="30" class="team">Worker · FND</text><text x="130" y="30" class="state" fill="#2f8f4e">● 진행 중</text></g>
    </g>
    <!-- Cosmile Worker -->
    <g transform="translate(680,248)">
      <use href="#unit"/><use href="#figW" x="37" y="-8"/>
      <g transform="translate(-30,52)"><rect width="184" height="42" rx="8" fill="#fff" stroke="#c9c2b4"/><circle cx="17" cy="16" r="9" fill="#2f6db0"/><text x="17" y="20" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">W</text><text x="34" y="15" class="name">Cosmile Worker</text><text x="34" y="30" class="team">Worker · FND</text><text x="140" y="30" class="state" fill="#b8791c">◐ 대기</text></g>
    </g>
    <!-- idle/reference peripheral seat + Channy (bottom-right) -->
    <g transform="translate(640,420)">
      <rect x="0" y="0" width="150" height="70" rx="10" fill="#efe9dd" stroke="#cdbfa6"/><text x="75" y="26" text-anchor="middle" class="tiny">유휴/참조</text><text x="75" y="42" text-anchor="middle" class="tiny">조용한 주변 좌석</text><text x="75" y="58" text-anchor="middle" class="tiny">(중립 · 작업 애니메이션 없음)</text>
    </g>
    <g transform="translate(820,470)"><ellipse cx="24" cy="34" rx="24" ry="5" fill="#000" opacity="0.10"/><path d="M4 24 C0 13 10 6 18 8 C 20 2 32 2 34 8 C 46 8 52 16 47 24 C 52 27 50 34 44 34 L 16 34 C 6 34 3 29 4 24Z" fill="#e8e4ec" stroke="#cfc8d8" stroke-width="1.2"/><circle cx="38" cy="17" r="1.8" fill="#3a3540"/><text x="24" y="50" text-anchor="middle" class="tiny">Channy · 앰비언트</text></g>
  </g>

  <text x="28" y="744" class="cap">역할 배치 근거: Advisor=조정+Mission Board · Control=아키텍처 표면 · Worker=개인 데스크 · Reviewer=독립 부스 · 유휴=주변 좌석 · 모든 액터 고유 위치 · 관계선 기본 숨김</text>
</svg>
