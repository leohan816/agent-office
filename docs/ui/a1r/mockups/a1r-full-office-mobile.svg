<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
  <title>A-1R Living Office — full mobile (390×844) with bottom sheet</title>
  <defs>
    <linearGradient id="mw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe7db"/><stop offset="1" stop-color="#e4dccb"/></linearGradient>
    <linearGradient id="mf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dcc2"/><stop offset="1" stop-color="#dcc9a6"/></linearGradient>
    <linearGradient id="mfp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe8f2"/><stop offset="1" stop-color="#c9d8ec"/></linearGradient>
    <linearGradient id="mvp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e2ee"/><stop offset="1" stop-color="#e6cfe0"/></linearGradient>
    <style>
      .h{font-size:16px;font-weight:700;fill:#2c2a26}.sub{font-size:11px;fill:#6b6459}
      .name{font-size:11.5px;font-weight:700;fill:#2c2a26}.team{font-size:9px;font-weight:600;fill:#5c554a}
      .state{font-size:10px;font-weight:700}.mbh{font-size:10.5px;font-weight:700;fill:#2c2a26}
      .mb{font-size:9.5px;fill:#3a352c}.lbl{font-size:10px;fill:#4a443a}.tiny{font-size:8.5px;fill:#8a8072}
    </style>
  </defs>
  <rect width="390" height="844" fill="url(#mw)"/>

  <!-- status + app bar -->
  <rect x="0" y="0" width="390" height="52" fill="#faf6ef"/><rect x="0" y="51" width="390" height="1" fill="#d8cfbf"/>
  <text x="16" y="24" class="h">리빙 오피스</text>
  <g transform="translate(16,30)"><rect width="70" height="18" rx="9" fill="#2f6db0"/><text x="35" y="13" text-anchor="middle" fill="#fff" font-size="9.5" font-weight="700">리빙</text>
  <rect x="76" width="86" height="18" rx="9" fill="#eee6d8" stroke="#cdbfa6"/><text x="119" y="13" text-anchor="middle" fill="#6b6459" font-size="9.5" font-weight="700">기술 대시보드</text></g>
  <g transform="translate(250,17)"><rect width="124" height="26" rx="8" fill="#eef3fa" stroke="#b9cbe6"/><text x="10" y="17" class="lbl">Advisor ▾ Foundation</text></g>

  <!-- collapsed accessible list -->
  <g transform="translate(16,62)"><rect width="358" height="26" rx="8" fill="#f1eadd" stroke="#cdbfa6"/><text x="12" y="17" class="lbl">▸ 접근 가능한 에이전트 목록 (8)</text></g>

  <!-- floor with stacked pods -->
  <rect x="0" y="96" width="390" height="470" fill="url(#mf)"/>
  <g stroke="#d0bb95" stroke-width="1" opacity="0.45"><line x1="90" y1="96" x2="70" y2="566"/><line x1="200" y1="96" x2="200" y2="566"/><line x1="300" y1="96" x2="320" y2="566"/><line x1="0" y1="230" x2="390" y2="230"/><line x1="0" y1="400" x2="390" y2="400"/></g>

  <!-- Foundation pod (top) -->
  <g transform="translate(14,104)">
    <polygon points="0,20 362,20 362,268 0,268" rx="8" fill="url(#mfp)" opacity="0.9" stroke="#8fb0d6"/>
    <rect x="0" y="0" width="250" height="24" rx="6" fill="#2f6db0"/><text x="10" y="16" class="mbh" fill="#fff">◆ Foundation Advisor Team</text><text x="262" y="16" class="team">FND</text>
    <g transform="translate(8,30)"><rect width="200" height="66" rx="6" fill="#f7fafd" stroke="#9db9dc"/><text x="8" y="16" class="mbh">미션 보드</text><text x="8" y="32" class="mb">A-1R Living Office · 설계 게이트</text><text x="8" y="46" class="mb">진행 3/9 · <tspan fill="#b8791c" font-weight="700">대기 · Leo</tspan></text><text x="8" y="60" class="tiny">KST 07-13 22:38</text></g>
    <!-- member desks compact -->
    <g font-size="9.5">
      <g transform="translate(8,104)"><rect width="168" height="26" rx="6" fill="#fff" stroke="#c9c2b4"/><circle cx="14" cy="13" r="7" fill="#7a4b8c"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">A</text><text x="26" y="12" class="name">Foundation Advisor</text><text x="26" y="23" class="team">Advisor</text><text x="150" y="17" class="state" fill="#2f8f4e" text-anchor="end">● 진행</text></g>
      <g transform="translate(186,104)"><rect width="168" height="26" rx="6" fill="#fff" stroke="#c9c2b4"/><circle cx="14" cy="13" r="7" fill="#3d3a34"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">C</text><text x="26" y="12" class="name">Foundation Control</text><text x="26" y="23" class="team">Control</text><text x="150" y="17" class="state" fill="#6b6459" text-anchor="end">◦ 불명</text></g>
      <g transform="translate(8,136)"><rect width="168" height="26" rx="6" fill="#fff" stroke="#c9c2b4"/><circle cx="14" cy="13" r="7" fill="#2f6db0"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">W</text><text x="26" y="12" class="name">Agent Office Worker</text><text x="26" y="23" class="team">Worker</text><text x="150" y="17" class="state" fill="#2f8f4e" text-anchor="end">● 진행</text></g>
      <g transform="translate(186,136)"><rect width="168" height="26" rx="6" fill="#fff" stroke="#c9c2b4"/><circle cx="14" cy="13" r="7" fill="#2f6db0"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">W</text><text x="26" y="12" class="name">Cosmile Worker</text><text x="26" y="23" class="team">Worker</text><text x="150" y="17" class="state" fill="#b8791c" text-anchor="end">◐ 대기</text></g>
      <g transform="translate(8,168)"><rect width="168" height="26" rx="6" fill="#fff" stroke="#e0b6a9"/><circle cx="14" cy="13" r="7" fill="#2f6db0"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">W</text><text x="26" y="12" class="name">SIASIU Worker</text><text x="26" y="23" class="team">Worker</text><text x="150" y="17" class="state" fill="#c0392b" text-anchor="end">■ 차단</text></g>
      <g transform="translate(186,168)"><rect width="168" height="26" rx="6" fill="#fff" stroke="#c9c2b4" stroke-dasharray="4 3"/><circle cx="14" cy="13" r="7" fill="#4a4a4a"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">R</text><text x="26" y="12" class="name">Independent Reviewer</text><text x="26" y="23" class="team">독립 부스</text><text x="150" y="17" class="state" fill="#6b6459" text-anchor="end">◦ 대기</text></g>
    </g>
  </g>

  <!-- VibeNews pod (below, spatially separated) -->
  <g transform="translate(14,384)">
    <polygon points="0,20 362,20 362,150 0,150" fill="url(#mvp)" opacity="0.92" stroke="#cf9dc4"/>
    <rect x="0" y="0" width="230" height="24" rx="6" fill="#a24d92"/><text x="10" y="16" class="mbh" fill="#fff">◆ VibeNews Advisor Team</text><text x="242" y="16" class="team">VBN</text>
    <g transform="translate(8,30)"><rect width="200" height="58" rx="6" fill="#fdf6fb" stroke="#d7a9cd"/><text x="8" y="16" class="mbh">미션 보드</text><text x="8" y="32" class="mb">콘텐츠 파이프라인 · 대기</text><text x="8" y="46" class="tiny">KST 검증 없음 · 미확인</text></g>
    <g font-size="9.5">
      <g transform="translate(216,30)"><rect width="138" height="26" rx="6" fill="#fff" stroke="#d7a9cd"/><circle cx="14" cy="13" r="7" fill="#7a4b8c"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">A</text><text x="26" y="12" class="name">VibeNews Advisor</text><text x="26" y="23" class="team">Advisor</text></g>
      <g transform="translate(216,62)"><rect width="138" height="26" rx="6" fill="#fff" stroke="#e0b6a9"/><circle cx="14" cy="13" r="7" fill="#a24d92"/><text x="14" y="16" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">W</text><text x="26" y="12" class="name">VibeNews Worker</text><text x="120" y="17" class="state" fill="#c0392b" text-anchor="end">⚠ 오류</text></g>
    </g>
  </g>

  <!-- Channy peripheral -->
  <g transform="translate(320,300)"><ellipse cx="20" cy="30" rx="20" ry="4" fill="#000" opacity="0.10"/><path d="M4 22 C1 12 9 6 16 8 C 18 3 28 3 30 8 C 40 8 45 15 41 22 C 45 25 44 31 39 31 L 14 31 C 6 31 3 27 4 22Z" fill="#e8e4ec" stroke="#cfc8d8"/><circle cx="34" cy="16" r="1.6" fill="#3a3540"/><text x="20" y="44" text-anchor="middle" class="tiny">Channy</text></g>

  <!-- bottom sheet (Tap actor -> compact bottom sheet -> 상세 보기 -> full drawer) -->
  <g transform="translate(0,566)">
    <rect x="0" y="0" width="390" height="278" rx="18" fill="#ffffff" stroke="#cdbfa6"/>
    <rect x="171" y="10" width="48" height="5" rx="3" fill="#d8cfbf"/>
    <text x="16" y="40" class="h">Agent Office Worker</text>
    <text x="16" y="58" class="sub">Worker · Foundation Advisor Team</text>
    <rect x="16" y="68" width="86" height="22" rx="11" fill="#e5f3ea"/><text x="59" y="83" text-anchor="middle" class="state" fill="#2f8f4e">● 진행 중</text>
    <line x1="16" y1="102" x2="374" y2="102" stroke="#eee5d6"/>
    <text x="16" y="126" class="lbl">미션 · A-1R Living Office</text>
    <text x="16" y="148" class="lbl">WorkUnit · BA-WU-03</text>
    <text x="16" y="170" class="lbl">모델 · claude-opus-4-8 · 노력 · high</text>
    <text x="16" y="192" class="lbl">진행 · 3/9 · 다음 · 목업 검토</text>
    <text x="16" y="214" class="lbl">보고 대상 · Foundation Advisor</text>
    <text x="16" y="236" class="tiny">KST 최종 검증 · 07-13 22:31 (검증된 UTC 변환)</text>
    <rect x="16" y="248" width="160" height="30" rx="8" fill="#2f6db0"/><text x="96" y="268" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">상세 보기 ▸</text>
    <text x="196" y="268" class="tiny">다른 액터 탭 → 교체 · 빈 공간 → 닫힘</text>
  </g>
</svg>
