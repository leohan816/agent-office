<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="'Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
  <title>A-1R — layered information + interaction states + critical-status overlay (exact tokens, fail-closed, no drawer collision)</title>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9a8f78"/></marker>
    <style>
      .h{font-size:20px;font-weight:700;fill:#2c2a26}.h2{font-size:14px;font-weight:700;fill:#234b78}
      .name{font-size:12.5px;font-weight:700;fill:#2c2a26}.team{font-size:10px;font-weight:600;fill:#5c554a}
      .state{font-size:11px;font-weight:700}.lbl{font-size:11px;fill:#4a443a}.k{font-size:10.5px;fill:#6b6459}
      .v{font-size:10.5px;font-weight:600;fill:#2c2a26}.tiny{font-size:9.5px;fill:#8a8072}.cap{font-size:11px;fill:#4a443a}
      .hdr{font-size:11px;font-weight:700;fill:#fff}.wm{font-size:9px;font-weight:700;fill:#a5762b}
    </style>
  </defs>
  <rect width="1200" height="920" fill="#f3ede2"/>
  <text x="28" y="34" class="h">정보 계층 · 상호작용 상태 · 임계 상태 오버레이</text>
  <text x="28" y="54" class="cap">기본 캔버스는 최소 정보만. 소스 기반 기술 사실은 요청 시 퀵카드 → 고정카드 → 전체 서랍(모바일: 바텀시트)로 점진 공개. 정확 토큰만 사용 · 미확정은 fail-closed.</text>
  <g transform="translate(760,30)"><rect width="412" height="24" rx="6" fill="#fbf3e4" stroke="#e2c890"/><text x="10" y="16" class="wm">◈ 카드/시트/서랍 값은 「설계 예시 · 실제 운영 아님」 · 원천 있는 토큰만 정확 표기</text></g>

  <!-- 1) compact default label -->
  <g transform="translate(28,90)">
    <text class="h2" y="-6">① 기본 라벨 (항상 노출)</text>
    <rect x="0" y="4" width="196" height="46" rx="9" fill="#fff" stroke="#c9c2b4"/>
    <circle cx="18" cy="27" r="10" fill="#2f6db0"/><text x="18" y="31" text-anchor="middle" class="hdr">W</text>
    <text x="34" y="22" class="name">Agent Office Worker</text>
    <text x="34" y="38" class="team">Worker · FND 파운데이션</text>
    <text x="158" y="38" class="state" fill="#2f8f4e">● 진행</text>
    <text x="0" y="70" class="tiny">이름 · 역할 · Team(색+짧은 텍스트 FND/VBN) · 핵심 상태만 · 색은 유일 신호 아님</text>
    <path d="M196 27 L 240 27" stroke="#9a8f78" stroke-width="2" marker-end="url(#a)"/><text x="200" y="18" class="tiny">hover</text>
  </g>

  <!-- 2) hover quick card -->
  <g transform="translate(270,90)">
    <text class="h2" y="-6">② 데스크톱 hover/focus 퀵카드</text>
    <rect x="0" y="4" width="256" height="180" rx="10" fill="#fff" stroke="#b9cbe6" stroke-width="1.5"/>
    <rect x="0" y="4" width="256" height="26" rx="10" fill="#eef3fa"/><text x="12" y="22" class="name">Agent Office Worker · Worker</text>
    <g font-size="10.5"><text x="12" y="50" class="k">현재 미션</text><text x="120" y="50" class="v">— (WU 미정의)</text>
    <text x="12" y="70" class="k">WorkUnit</text><text x="120" y="70" class="v">— (승인 후 정의)</text>
    <text x="12" y="90" class="k">모델 · 노력</text><text x="120" y="90" class="v">claude-opus-4-8 · ULTRACODE</text>
    <text x="12" y="110" class="k">차단 / Leo</text><text x="120" y="110" class="v" fill="#2f8f4e">없음 / 대기 아님</text>
    <text x="12" y="130" class="k">런타임(근거)</text><text x="120" y="130" class="v">AI_READY</text>
    <text x="12" y="150" class="k">KST 최종 검증</text><text x="120" y="150" class="v">— (검증 UTC 원천 시)</text></g>
    <text x="12" y="170" class="wm">설계 예시 · 실제 운영 아님</text>
    <path d="M256 90 L 300 90" stroke="#9a8f78" stroke-width="2" marker-end="url(#a)"/><text x="262" y="82" class="tiny">click</text>
  </g>

  <!-- 3) pinned card (exactly one; incl. blocker/Leo) -->
  <g transform="translate(620,90)">
    <text class="h2" y="-6">③ 클릭 고정 카드 (정확히 1개)</text>
    <rect x="0" y="4" width="266" height="222" rx="10" fill="#fff" stroke="#2f6db0" stroke-width="2"/>
    <rect x="0" y="4" width="266" height="26" rx="10" fill="#2f6db0"/><text x="12" y="22" class="hdr">Agent Office Worker · ◉ 고정</text>
    <g font-size="10.5"><text x="12" y="52" class="k">미션 · WU</text><text x="120" y="52" class="v">— / — (승인 후)</text>
    <text x="12" y="72" class="k">런타임</text><text x="120" y="72" class="v">AI_READY (근거)</text>
    <text x="12" y="92" class="k">진행</text><text x="120" y="92" class="v">0 / 0 (미확정)</text>
    <text x="12" y="112" class="k">차단 / Leo</text><text x="120" y="112" class="v" fill="#2f8f4e">없음 / 대기 아님</text>
    <text x="12" y="132" class="k">다음 액션</text><text x="120" y="132" class="v">— (미정의)</text>
    <text x="12" y="152" class="k">보고 대상</text><text x="120" y="152" class="v">Foundation Advisor</text>
    <text x="12" y="172" class="k">모델 · 노력</text><text x="120" y="172" class="v">claude-opus-4-8 · ULTRACODE</text></g>
    <rect x="12" y="184" width="94" height="26" rx="7" fill="#eef3fa" stroke="#b9cbe6"/><text x="59" y="201" text-anchor="middle" class="v" fill="#2f6db0">상세 보기 ▸</text>
    <text x="116" y="195" class="tiny">다른 액터=교체 · 빈 공간·Esc=닫힘</text><text x="116" y="209" class="wm">설계 예시 · 실제 운영 아님</text>
    <path d="M266 110 L 300 110" stroke="#9a8f78" stroke-width="2" marker-end="url(#a)"/><text x="270" y="102" class="tiny">상세</text>
  </g>

  <!-- 4) full drawer (17-field; exact tokens; fail-closed; clear of legend) -->
  <g transform="translate(922,90)">
    <text class="h2" y="-6">④ 전체 서랍 (완전 계약 · 보존)</text>
    <rect x="0" y="4" width="250" height="454" rx="10" fill="#fff" stroke="#c9c2b4" stroke-width="1.5"/>
    <rect x="0" y="4" width="250" height="30" rx="10" fill="#3d3a34"/><text x="12" y="24" class="hdr">상세 · Agent Office Worker</text>
    <g font-size="10"><g fill="#6b6459">
      <text x="12" y="52">roleInstanceId</text><text x="12" y="72">stableDisplayName</text><text x="12" y="92">role</text><text x="12" y="112">project</text>
      <text x="12" y="132">advisorTeam</text><text x="12" y="152">reportsToAdvisor</text><text x="12" y="172">assignedBy</text><text x="12" y="192">returnsResultTo</text>
      <text x="12" y="212">sessionName</text><text x="12" y="232">sessionProcess</text><text x="12" y="252">aiIdentity</text><text x="12" y="272">model</text>
      <text x="12" y="292">effort</text><text x="12" y="312">aiRuntimeState</text><text x="12" y="332">operationalState</text><text x="12" y="352">mission</text><text x="12" y="372">workUnit</text></g>
      <g fill="#2c2a26" font-weight="600" text-anchor="end"><text x="238" y="52">agent-office-worker</text><text x="238" y="72">Agent Office Worker</text><text x="238" y="92">WORKER</text><text x="238" y="112">AGENT_OFFICE</text>
      <text x="238" y="132">FOUNDATION_ADVISOR_TEAM</text><text x="238" y="152">foundation-advisor</text><text x="238" y="172">foundation-advisor</text><text x="238" y="192">foundation-advisor</text>
      <text x="238" y="212">agent-office-opus</text><text x="238" y="232">AI_PROCESS_DETECTED</text><text x="238" y="252">CLAUDE_OPUS_4_8</text><text x="238" y="272">claude-opus-4-8</text>
      <text x="238" y="292">ULTRACODE</text><text x="238" y="312">AI_READY</text><text x="238" y="332">— (미확정)</text><text x="238" y="352">— (미정의)</text><text x="238" y="372">— (미정의)</text></g>
    </g>
    <line x1="12" y1="384" x2="238" y2="384" stroke="#eee5d6"/>
    <text x="12" y="402" class="tiny">각 필드 = 소스/상태/근거 provenance 보존</text>
    <text x="12" y="418" class="tiny">미확인/미정의 → fail-closed sentinel (UNKNOWN / —)</text>
    <text x="12" y="434" class="tiny">Esc·빈 공간·닫기=닫힘 · 포커스 복원</text>
    <text x="12" y="452" class="wm">설계 예시 · 실제 운영 아님</text>
  </g>

  <!-- mobile bottom sheet mini -->
  <g transform="translate(28,300)">
    <text class="h2" y="-6">⑤ 모바일: 탭 → 바텀시트 → 상세 보기 → 서랍</text>
    <rect x="0" y="4" width="222" height="300" rx="16" fill="#fff" stroke="#cdbfa6"/>
    <rect x="92" y="16" width="36" height="5" rx="3" fill="#d8cfbf"/>
    <text x="14" y="44" class="name">Agent Office Worker</text><text x="14" y="60" class="team">Worker · FND 파운데이션</text>
    <rect x="14" y="70" width="80" height="20" rx="10" fill="#e5f3ea"/><text x="54" y="84" text-anchor="middle" class="state" fill="#2f8f4e">● 진행 중</text>
    <line x1="14" y1="102" x2="206" y2="102" stroke="#eee5d6"/>
    <g font-size="10.5"><text x="14" y="124" class="k">미션 · — (승인 후)</text><text x="14" y="144" class="k">WU · —</text><text x="14" y="164" class="k">모델·노력 · claude-opus-4-8·ULTRACODE</text><text x="14" y="184" class="k">차단/Leo · 없음 / 대기 아님</text><text x="14" y="204" class="k">보고 · Foundation Advisor</text></g>
    <text x="14" y="226" class="tiny">KST · — (검증 UTC 원천 시)</text>
    <rect x="14" y="238" width="130" height="28" rx="8" fill="#2f6db0"/><text x="79" y="257" text-anchor="middle" class="hdr">상세 보기 ▸</text>
    <text x="14" y="288" class="wm">설계 예시 · 실제 운영 아님</text>
  </g>

  <!-- state badge legend (8 C-1 states) — confined to x<560 so it never covers the drawer -->
  <g transform="translate(270,320)">
    <text class="h2" y="0">핵심 상태 배지 · 직접 노출 (색 + 아이콘 + 한글)</text>
    <g font-size="10.5" font-weight="700">
      <g transform="translate(0,16)"><rect width="150" height="28" rx="8" fill="#e5f3ea"/><text x="10" y="19" fill="#2f8f4e">● 진행 중 (ACTIVE)</text></g>
      <g transform="translate(158,16)"><rect width="140" height="28" rx="8" fill="#fbf1de"/><text x="10" y="19" fill="#b8791c">◐ 대기 (WAITING)</text></g>
      <g transform="translate(306,16)"><rect width="150" height="28" rx="8" fill="#fbe3df"/><text x="10" y="19" fill="#c0392b">■ 차단됨 (BLOCKED)</text></g>
      <g transform="translate(0,50)"><rect width="180" height="28" rx="8" fill="#ede4f5"/><text x="10" y="19" fill="#6b3fa0">◆ Leo/GPT 결정 대기</text></g>
      <g transform="translate(188,50)"><rect width="150" height="28" rx="8" fill="#e7e2da"/><text x="10" y="19" fill="#57514a">◌ 세션 오프라인</text></g>
      <g transform="translate(346,50)"><rect width="150" height="28" rx="8" fill="#e7e2da"/><text x="10" y="19" fill="#57514a">◌ AI 프로세스 없음</text></g>
      <g transform="translate(0,84)"><rect width="150" height="28" rx="8" fill="#fbe3df"/><text x="10" y="19" fill="#c0392b">⚠ AI 오류 (AI_ERROR)</text></g>
      <g transform="translate(158,84)"><rect width="150" height="28" rx="8" fill="#eceae6"/><text x="10" y="19" fill="#6b6459">◦ 상태 불명 (UNKNOWN)</text></g>
    </g>
  </g>

  <!-- SDR-06: read-only critical-status overlay example -->
  <g transform="translate(270,460)">
    <text class="h2" y="0">임계 상태 오버레이 (읽기 전용 · AlertRaised/BlockerOpened 근거 · PixelOperationalState 아님)</text>
    <g transform="translate(0,12)"><rect width="290" height="72" rx="8" fill="#fdeeee" stroke="#d8a39a"/><text x="12" y="22" font-size="11.5" font-weight="700" fill="#a03024">▲ 권한/보안 홀드</text><text x="12" y="42" class="k">원천: BlockerKind.AUTHENTICATION_REQUIRED</text><text x="12" y="58" class="v">상세: 인증 필요 (정본 라벨 유지)</text><text x="12" y="70" class="tiny" fill="#a5762b">MANUAL_ACTION_REQUIRED 단독으로는 홀드 주장 불가</text></g>
    <g transform="translate(300,12)"><rect width="230" height="72" rx="8" fill="#f3ecfa" stroke="#b79bd6"/><text x="12" y="22" font-size="11.5" font-weight="700" fill="#5a2f9e">◆ 범위 충돌</text><text x="12" y="42" class="k">원천: BlockerKind.SCOPE_CONFLICT</text><text x="12" y="58" class="v">상세: 범위 충돌 (정본 라벨)</text><text x="12" y="70" class="tiny">Leo 결정 필요는 별도 표기 유지</text></g>
    <text x="0" y="102" class="cap">우선순위: 권한/보안 홀드 &gt; 범위 충돌 &gt; C-1 상태 · 공존 시 최고순위=라벨 아이콘</text>
    <text x="0" y="118" class="cap">모든 의미는 카드/서랍/시맨틱에 유지 · 해소/미확인/불일치=중립 「상태 불명」 fail-closed · 활동 추정 금지</text>
  </g>

  <!-- interaction rules -->
  <g transform="translate(270,600)">
    <text class="h2" y="0">상호작용 규칙</text>
    <g class="lbl" font-size="11">
      <text y="22">· hover/focus → 퀵카드(자동 배치, 액터·가구 비가림) · 포커스 이탈 시 닫힘</text>
      <text y="42">· click/tap → 고정 카드/바텀시트 (정확히 1개) · 다른 액터=교체 · 빈 공간/빈 Office/Esc=닫힘 · 포커스 복원</text>
      <text y="62">· 상세 보기 → 전체 서랍 (완전 필드·provenance 보존)</text>
      <text y="82">· 관계선: 기본 숨김 · 명시적 액터/Team/관계 선택 시에만 표시</text>
      <text y="102">· 키보드 전용 도달 가능 · 200% 확대·고대비·감속 모션 지원</text>
    </g>
  </g>

  <!-- mode equivalence -->
  <g transform="translate(760,564)">
    <text class="h2" y="0">모드별 동등성</text>
    <rect x="0" y="12" width="412" height="300" rx="10" fill="#fbf8f2" stroke="#cdbfa6"/>
    <g font-size="10.5" class="lbl">
      <text x="14" y="36" class="v">일반 시각 모드</text><text x="14" y="54">· 큰 액터 리스트는 「접근 가능한 에이전트 목록 (N)」로 접힘 · 스크린리더 패리티 유지</text>
      <text x="14" y="82" class="v">정적/무캔버스 · 고텍스트 · 렌더 실패 · 접근성 모드</text><text x="14" y="100">· 시맨틱 리스트가 기본(primary) · 동일 서랍·동일 사실 열람</text>
      <text x="14" y="128" class="v">감속 모션(reduced motion)</text><text x="14" y="146">· 모든 앰비언트/전환 정지 · 의미는 색 외 신호로 유지</text>
      <text x="14" y="174" class="v">고텍스트(≥1.3×)·200%</text><text x="14" y="192">· 라벨 폭 고정, 높이만 증가 · 겹침·잘림·이탈 0</text>
      <text x="14" y="220" class="v">시맨틱 등가</text><text x="14" y="238">· 캔버스의 모든 상태/사실(임계 오버레이 포함)은 텍스트로 동일 접근</text>
      <text x="14" y="266" class="v">임계 오버레이 시맨틱</text><text x="14" y="284">· 「권한/보안 홀드 · 인증 필요」/「범위 충돌」을 정본 라벨로 announce</text>
      <text x="14" y="304" class="tiny">기본 세계에 기술 마이크로카피를 사실 증명용으로 넣지 않음</text>
    </g>
  </g>

  <text x="28" y="900" class="cap">이전 실패 회피: 244×180 고정 카드/7개 상시 기술 팩트/변위 커넥터 제거 → 최소 라벨 + 온디맨드 계층 · 정확 토큰·fail-closed·설계 예시 명시 · 테스트가 아니라 제품 사용에서 출발</text>
</svg>
