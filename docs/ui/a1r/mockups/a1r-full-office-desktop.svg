      <circle cx="28" cy="2" r="9" fill="#e9c9a0"/><rect x="18" y="10" width="20" height="16" rx="5" fill="#2f6db0"/>
      <g transform="translate(-8,46)"><rect width="150" height="40" rx="7" fill="#fff" stroke="#c9c2b4"/><circle cx="15" cy="14" r="8" fill="#2f6db0"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">W</text><text x="30" y="13" class="name">Agent Office Worker</text><text x="30" y="27" class="team">개인 데스크 · Worker</text><text x="112" y="27" class="state" fill="#2f8f4e">● 진행 중</text></g>
    </g>
    <g transform="translate(258,300)">
      <rect x="-4" y="16" width="70" height="24" rx="4" fill="#c9a86a"/>
      <circle cx="28" cy="2" r="9" fill="#e9c9a0"/><rect x="18" y="10" width="20" height="16" rx="5" fill="#2f6db0"/>
      <g transform="translate(-8,46)"><rect width="150" height="40" rx="7" fill="#fff" stroke="#c9c2b4"/><circle cx="15" cy="14" r="8" fill="#2f6db0"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">W</text><text x="30" y="13" class="name">Cosmile Worker</text><text x="30" y="27" class="team">개인 데스크 · Worker</text><text x="118" y="27" class="state" fill="#b8791c">◐ 대기</text></g>
    </g>
    <g transform="translate(60,300)">
      <rect x="-4" y="16" width="70" height="24" rx="4" fill="#c9a86a"/>
      <circle cx="28" cy="2" r="9" fill="#e9c9a0"/><rect x="18" y="10" width="20" height="16" rx="5" fill="#2f6db0"/>
      <g transform="translate(-10,46)"><rect width="150" height="40" rx="7" fill="#fff" stroke="#c9c2b4"/><circle cx="15" cy="14" r="8" fill="#2f6db0"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">W</text><text x="30" y="13" class="name">SIASIU Worker</text><text x="30" y="27" class="team">개인 데스크 · Worker</text><text x="118" y="27" class="state" fill="#c0392b">■ 차단됨</text></g>
    </g>

    <!-- Reviewer independent booth/zone -->
    <g transform="translate(430,300)">
      <rect x="-10" y="-6" width="176" height="96" rx="10" fill="#f4f1ea" stroke="#b7ae9c" stroke-dasharray="5 4"/>
      <text x="78" y="10" text-anchor="middle" class="tiny">독립 부스 · Reviewer</text>
      <rect x="26" y="20" width="70" height="24" rx="4" fill="#c9a86a"/>
      <circle cx="58" cy="8" r="9" fill="#e9c9a0"/><rect x="48" y="16" width="20" height="16" rx="5" fill="#4a4a4a"/>
      <g transform="translate(6,50)"><rect width="150" height="40" rx="7" fill="#fff" stroke="#c9c2b4"/><circle cx="15" cy="14" r="8" fill="#4a4a4a"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">R</text><text x="30" y="13" class="name">Independent Reviewer</text><text x="30" y="27" class="team">독립 검토 · Reviewer</text><text x="120" y="27" class="state" fill="#6b6459">◦ 대기</text></g>
    </g>
  </g>

  <!-- ============ VIBENEWS Advisor Team Pod (right / smaller; 2 members) ============ -->
  <g transform="translate(690,300)">
    <polygon points="0,20 380,20 430,410 -30,410" fill="url(#vPod)" opacity="0.92" stroke="#cf9dc4" stroke-width="2"/>
    <rect x="0" y="-16" width="300" height="30" rx="6" fill="#a24d92"/>
    <text x="12" y="4" class="mbh" fill="#fff">◆ VibeNews Advisor Team</text>
    <text x="312" y="4" class="team">VBN · 바이브뉴스</text>

    <g transform="translate(0,26)">
      <rect x="0" y="0" width="230" height="112" rx="8" fill="#fdf6fb" stroke="#d7a9cd"/>
      <rect x="0" y="0" width="230" height="22" rx="8" fill="#f2ddec"/><text x="10" y="16" class="mbh">미션 보드 · VibeNews</text>
