    <rect x="12" y="736" width="172" height="30" rx="6" fill="#efe9dd" stroke="#cdbfa6"/>
    <text x="98" y="755" text-anchor="middle" class="tiny" fill="#8a8072">입력 잠김 · 승인·호환성 증명 후 개방</text>
    <text x="12" y="786" class="tiny">브라우저→에이전트 직접 지시 금지</text>
