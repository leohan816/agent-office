      <text x="10" y="96" class="tiny">KST 검증 없음 · 미확인은 미확인</text>
    </g>
    <!-- Advisor -->
    <g transform="translate(266,44)">
      <rect x="-8" y="16" width="86" height="28" rx="4" fill="#c9a86a"/>
      <circle cx="35" cy="2" r="9" fill="#e9c9a0"/><rect x="24" y="10" width="22" height="18" rx="6" fill="#a24d92"/>
      <g transform="translate(-12,48)"><rect width="150" height="40" rx="7" fill="#fff" stroke="#d7a9cd"/><circle cx="15" cy="14" r="8" fill="#7a4b8c"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">A</text><text x="30" y="13" class="name">VibeNews Advisor</text><text x="30" y="27" class="team">조정 · Advisor</text><text x="110" y="27" class="state" fill="#6b6459">◦ 상태 불명</text></g>
    </g>
    <!-- Worker (AI_ERROR critical state directly visible) -->
    <g transform="translate(150,214)">
      <rect x="-4" y="16" width="70" height="24" rx="4" fill="#c9a86a"/>
      <circle cx="28" cy="2" r="9" fill="#e9c9a0"/><rect x="18" y="10" width="20" height="16" rx="5" fill="#a24d92"/>
      <g transform="translate(-8,46)"><rect width="152" height="40" rx="7" fill="#fff" stroke="#e0b6a9"/><circle cx="15" cy="14" r="8" fill="#a24d92"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">W</text><text x="30" y="13" class="name">VibeNews Worker</text><text x="30" y="27" class="team">개인 데스크 · Worker</text><text x="112" y="27" class="state" fill="#c0392b">⚠ AI 오류</text></g>
    </g>
  </g>

  <!-- ===== Channy (Bedlington terrier, ambient, peripheral, non-operational) ===== -->
  <g transform="translate(300,720)">
    <ellipse cx="34" cy="46" rx="34" ry="7" fill="#000" opacity="0.10"/>
    <path d="M6 34 C 2 20 14 10 26 12 C 30 4 44 4 48 12 C 62 12 70 22 64 34 C 70 38 68 48 60 48 L 54 48 L 54 40 L 46 40 L 46 48 L 22 48 L 22 40 L 14 40 L 14 48 L 10 48 C 3 48 2 40 6 34 Z" fill="#e8e4ec" stroke="#cfc8d8" stroke-width="1.5"/>
    <path d="M26 12 C 20 6 12 8 12 16 C 16 16 22 14 26 12 Z" fill="#ddd6e6"/>
    <circle cx="52" cy="24" r="2" fill="#3a3540"/>
    <text x="34" y="66" text-anchor="middle" class="tiny">Channy · 권한 없음 · 앰비언트</text>
  </g>

  <!-- ===== hover quick card example (auto-placed; never covers actor/furniture) ===== -->
  <g transform="translate(470,560)">
    <use href="#pin" x="-140" y="-8"/>
    <rect x="0" y="0" width="238" height="150" rx="10" fill="#ffffff" stroke="#b9cbe6" stroke-width="1.5"/>
    <rect x="0" y="0" width="238" height="26" rx="10" fill="#eef3fa"/>
    <text x="12" y="18" class="mbh">Agent Office Worker · Worker</text>
    <text x="12" y="46" class="lbl">미션 · A-1R Living Office</text>
    <text x="12" y="64" class="lbl">WorkUnit · BA-WU-03</text>
    <text x="12" y="82" class="lbl">모델 · claude-opus-4-8 · 노력 · high</text>
    <text x="12" y="100" class="lbl">상태 · <tspan fill="#2f8f4e" font-weight="700">진행 중</tspan> · Leo 대기 아님</text>
    <text x="12" y="118" class="lbl">런타임 · AI_WORKING (근거 기반)</text>
    <text x="12" y="138" class="tiny">KST 최종 검증 · 07-13 22:31 · 클릭 시 고정</text>
  </g>

  <!-- ===== docked Advisor chat panel location (truthful, disabled by default) ===== -->
  <g transform="translate(1224,72)">
    <rect x="0" y="0" width="196" height="812" rx="10" fill="#faf6ef" stroke="#d8cfbf"/>
    <rect x="0" y="0" width="196" height="30" rx="10" fill="#f1eadd"/>
    <text x="12" y="20" class="mbh">Advisor 대화</text>
    <rect x="12" y="42" width="172" height="26" rx="6" fill="#fbeae6" stroke="#e6c2b6"/>
    <text x="98" y="59" text-anchor="middle" class="tiny" fill="#a5533f">DELIVERY_DISABLED · 전송 비활성화</text>
    <text x="12" y="92" class="lbl">선택된 Advisor</text>
    <text x="12" y="110" class="name">Foundation Advisor</text>
    <rect x="12" y="126" width="172" height="1" fill="#e6ddcc"/>
    <text x="12" y="150" class="tiny">전사(안전 요약)만 표시:</text>
