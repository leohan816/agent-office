    <rect x="0" y="0" width="384" height="176" rx="8" fill="#fbf8f2" stroke="#cdbfa6"/>
    <text x="10" y="18" class="mbh">동일 계약 · Leo 캡처 와이드/숏 (1512×619)</text>
    <rect x="10" y="26" width="364" height="118" rx="4" fill="url(#floor)"/>
    <!-- two separated pods reflow into a wide short band -->
    <polygon points="20,40 180,40 190,132 14,132" fill="url(#fPod)" stroke="#8fb0d6"/>
    <polygon points="210,44 356,44 366,132 202,132" fill="url(#vPod)" stroke="#cf9dc4"/>
    <rect x="24" y="34" width="110" height="12" rx="3" fill="#2f6db0"/><rect x="214" y="38" width="96" height="12" rx="3" fill="#a24d92"/>
    <g fill="#fff" stroke="#c9c2b4"><rect x="26" y="58" width="66" height="16" rx="3"/><rect x="100" y="58" width="66" height="16" rx="3"/><rect x="26" y="88" width="66" height="16" rx="3"/><rect x="100" y="88" width="66" height="16" rx="3"/><rect x="26" y="112" width="66" height="14" rx="3"/><rect x="216" y="60" width="66" height="16" rx="3"/><rect x="216" y="92" width="66" height="16" rx="3"/></g>
