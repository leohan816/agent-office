<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="'Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
  <title>A-1R Living Office — full desktop (1440×900 design canvas) + Leo wide/short reflow</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7db"/><stop offset="1" stop-color="#e4dccb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc2"/><stop offset="1" stop-color="#dcc9a6"/>
    </linearGradient>
    <linearGradient id="fPod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe8f2"/><stop offset="1" stop-color="#c9d8ec"/>
    </linearGradient>
    <linearGradient id="vPod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e2ee"/><stop offset="1" stop-color="#e6cfe0"/>
    </linearGradient>
    <style>
      .h{font-size:22px;font-weight:700;fill:#2c2a26}
      .sub{font-size:13px;fill:#6b6459}
      .chip{font-size:12px;font-weight:600}
      .name{font-size:12.5px;font-weight:700;fill:#2c2a26}
      .role{font-size:10.5px;font-weight:700;letter-spacing:.4px}
      .team{font-size:10px;font-weight:600;fill:#5c554a}
      .state{font-size:11px;font-weight:700}
      .mb{font-size:10.5px;fill:#3a352c}
      .mbh{font-size:11px;font-weight:700;fill:#2c2a26}
      .lbl{font-size:11px;fill:#4a443a}
      .note{font-size:11px;fill:#7a7264}
      .tiny{font-size:9.5px;fill:#8a8072}
    </style>
    <!-- compact actor label: name + role dot + Korean state + short team text -->
    <g id="pin"><path d="M0 0 C 6 0 10 4 10 10 C 10 17 0 26 0 26 C 0 26 -10 17 -10 10 C -10 4 -6 0 0 0 Z" fill="#3a352c" opacity="0.28"/></g>
  </defs>

  <rect width="1440" height="900" fill="url(#wall)"/>

  <!-- ===== top app bar (Korean-first chrome) ===== -->
  <rect x="0" y="0" width="1440" height="56" fill="#faf6ef"/>
  <rect x="0" y="55" width="1440" height="1" fill="#d8cfbf"/>
  <text x="28" y="35" class="h">에이전트 오피스 · 리빙 오피스</text>
  <g transform="translate(300,16)">
    <rect x="0" y="0" width="104" height="26" rx="13" fill="#2f6db0"/><text x="52" y="17" text-anchor="middle" class="chip" fill="#fff">리빙 오피스</text>
    <rect x="112" y="0" width="104" height="26" rx="13" fill="#eee6d8" stroke="#cdbfa6"/><text x="164" y="17" text-anchor="middle" class="chip" fill="#6b6459">기술 대시보드</text>
  </g>
  <!-- collapsed accessible agent list control (ordinary visual mode) -->
  <g transform="translate(880,15)">
    <rect x="0" y="0" width="228" height="28" rx="8" fill="#f1eadd" stroke="#cdbfa6"/>
    <text x="14" y="19" class="lbl">▸ 접근 가능한 에이전트 목록 (8)</text>
  </g>
  <!-- advisor selector -->
  <g transform="translate(1128,15)">
    <rect x="0" y="0" width="140" height="28" rx="8" fill="#eef3fa" stroke="#b9cbe6"/>
    <text x="12" y="19" class="lbl">Advisor ▾ Foundation</text>
  </g>
  <g transform="translate(1288,15)">
    <rect x="0" y="0" width="124" height="28" rx="8" fill="#fbeae6" stroke="#e6c2b6"/>
    <text x="62" y="19" text-anchor="middle" class="tiny" fill="#a5533f">대화 · 비활성화됨</text>
  </g>

  <!-- ===== the one shared floor (3/4 perspective, diamond tiles) ===== -->
  <g>
    <polygon points="40,150 1130,150 1210,858 40,858" fill="url(#floor)"/>
    <!-- diamond tile hint -->
    <g stroke="#d0bb95" stroke-width="1" opacity="0.5">
      <line x1="120" y1="150" x2="120" y2="858"/><line x1="260" y1="150" x2="280" y2="858"/>
      <line x1="400" y1="150" x2="450" y2="858"/><line x1="540" y1="150" x2="620" y2="858"/>
      <line x1="680" y1="150" x2="790" y2="858"/><line x1="820" y1="150" x2="960" y2="858"/>
      <line x1="960" y1="150" x2="1130" y2="858"/>
      <line x1="40" y1="270" x2="1148" y2="270"/><line x1="40" y1="410" x2="1170" y2="410"/>
      <line x1="40" y1="560" x2="1190" y2="560"/><line x1="40" y1="710" x2="1205" y2="710"/>
    </g>
  </g>

  <!-- ============ FOUNDATION Advisor Team Pod (left / larger; 6 members incl. Agent Office) ============ -->
  <g transform="translate(64,168)">
    <polygon points="0,40 560,40 600,470 -30,470" fill="url(#fPod)" opacity="0.9" stroke="#8fb0d6" stroke-width="2"/>
    <!-- restrained accent bar + short team text (color never the only signal) -->
    <rect x="0" y="0" width="360" height="30" rx="6" fill="#2f6db0"/>
    <text x="12" y="20" class="mbh" fill="#fff">◆ Foundation Advisor Team</text>
    <text x="372" y="20" class="team">FND · 파운데이션</text>

    <!-- Team Mission Board -->
    <g transform="translate(0,44)">
      <rect x="0" y="0" width="238" height="120" rx="8" fill="#f7fafd" stroke="#9db9dc"/>
      <rect x="0" y="0" width="238" height="22" rx="8" fill="#dce9f7"/><text x="10" y="16" class="mbh">미션 보드 · Foundation</text>
      <text x="10" y="42" class="mb">미션: A-1R Living Office 리파인먼트</text>
      <text x="10" y="60" class="mb">진행: 설계 게이트 · 3/9 WU</text>
      <text x="10" y="78" class="mb">상태: <tspan fill="#b8791c" font-weight="700">대기 · Leo 승인</tspan></text>
      <text x="10" y="96" class="mb">다음: 정적 목업 검토 → 승인</text>
      <text x="10" y="112" class="tiny">KST 검증 07-13 22:38 · 사실만</text>
    </g>

    <!-- Advisor coordination desk + Mission Board owner -->
    <g transform="translate(276,60)">
      <rect x="-8" y="18" width="86" height="30" rx="4" fill="#c9a86a"/><rect x="-8" y="14" width="86" height="8" rx="3" fill="#b8965a"/>
      <circle cx="35" cy="4" r="9" fill="#e9c9a0"/><rect x="24" y="12" width="22" height="18" rx="6" fill="#2f6db0"/>
      <g transform="translate(-12,54)"><rect width="150" height="40" rx="7" fill="#fff" stroke="#9db9dc"/><circle cx="15" cy="14" r="8" fill="#7a4b8c"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">A</text><text x="30" y="13" class="name">Foundation Advisor</text><text x="30" y="27" class="team">조정 · Advisor</text><text x="100" y="27" class="state" fill="#2f8f4e">● 진행 중</text></g>
    </g>

    <!-- Control architecture/design surface -->
    <g transform="translate(60,196)">
      <rect x="-6" y="16" width="78" height="26" rx="4" fill="#c9a86a"/><rect x="-6" y="10" width="78" height="8" rx="3" fill="#8fb0d6"/>
      <circle cx="30" cy="2" r="9" fill="#e9c9a0"/><rect x="20" y="10" width="20" height="16" rx="5" fill="#3d3a34"/>
      <g transform="translate(-10,48)"><rect width="150" height="40" rx="7" fill="#fff" stroke="#c9c2b4"/><circle cx="15" cy="14" r="8" fill="#3d3a34"/><text x="15" y="18" text-anchor="middle" class="role" fill="#fff">C</text><text x="30" y="13" class="name">Foundation Control</text><text x="30" y="27" class="team">설계 데스크 · Control</text><text x="118" y="27" class="state" fill="#6b6459">◦ 상태 불명</text></g>
    </g>

    <!-- Worker desks: Agent Office / Cosmile / SIASIU (Agent Office is a Foundation member, no separate pod) -->
    <g transform="translate(258,196)">
