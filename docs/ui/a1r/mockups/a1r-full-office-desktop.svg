  <!-- ===== footer notes ===== -->
  <text x="28" y="884" class="note">기본 뷰: 관계선 숨김 · 고정 카드 0..1 · 이름/역할/Team/상태만 캔버스 노출 · 기술 팩트는 카드/서랍/시맨틱/대시보드에 보존</text>

  <!-- ===== inset: Leo capture wide/short reflow (1512×619 shape) ===== -->
