<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="'Noto Sans KR','Malgun Gothic',system-ui,sans-serif">
  <title>A-1R — Channy (Bedlington Terrier) silhouette, scale, ambient poses, non-operational</title>
  <style>
    .h{font-size:20px;font-weight:700;fill:#2c2a26}.cap{font-size:11px;fill:#4a443a}
    .pl{font-size:11px;font-weight:700;fill:#3a3540}.tiny{font-size:9.5px;fill:#8a8072}.warn{font-size:11px;font-weight:700;fill:#a5533f}
    .coat{fill:#e9e5ef;stroke:#cdc6da;stroke-width:1.5}.coat2{fill:#ddd6e6}
  </style>
  <rect width="960" height="620" fill="#f3ede2"/>
  <text x="28" y="36" class="h">Channy · 베들링턴 테리어 — 실루엣 · 스케일 · 앰비언트 포즈</text>
  <text x="28" y="56" class="cap">양(lamb) 같은 곱슬 코트 · 아치형 등 · 잘록한 허리 · 뾰족한 주둥이 · 술 달린 귀. 권한 없음 · 비운영.</text>

  <!-- scale reference: Channy vs actor character -->
  <g transform="translate(40,86)">
    <rect x="0" y="0" width="270" height="150" rx="10" fill="#fbf8f2" stroke="#cdbfa6"/>
    <text x="12" y="20" class="pl">스케일 기준 (액터 대비)</text>
    <!-- actor -->
    <g transform="translate(60,40)"><circle cx="0" cy="0" r="16" fill="#e9c9a0"/><rect x="-16" y="14" width="32" height="46" rx="10" fill="#2f6db0"/><text x="0" y="94" text-anchor="middle" class="tiny">액터 ~2 타일</text></g>
    <line x1="120" y1="30" x2="120" y2="100" stroke="#d8cfbf" stroke-dasharray="3 3"/>
    <!-- channy small -->
    <g transform="translate(150,58)">
      <path d="M6 30 C 0 16 12 6 24 9 C 27 1 44 1 47 10 C 62 10 70 22 62 32 C 68 35 66 44 58 44 L 52 44 L 52 34 L 44 34 L 44 44 L 22 44 L 22 34 L 14 34 L 14 44 L 9 44 C 2 44 1 36 6 30 Z" class="coat"/>
      <path d="M24 9 C 16 3 8 6 9 15 C 14 15 20 12 24 9 Z" class="coat2"/><circle cx="52" cy="20" r="2" fill="#3a3540"/>
      <text x="34" y="70" text-anchor="middle" class="tiny">Channy ~1.2 타일 (무릎 높이)</text>
    </g>
  </g>

  <!-- silhouette callout -->
  <g transform="translate(330,86)">
    <rect x="0" y="0" width="590" height="150" rx="10" fill="#fbf8f2" stroke="#cdbfa6"/>
    <text x="12" y="20" class="pl">인식 가능한 실루엣 특징</text>
    <g transform="translate(40,34)">
      <path d="M12 74 C 2 52 22 30 46 34 C 52 14 92 14 98 34 C 128 32 146 56 130 78 C 142 84 138 104 122 104 L 110 104 L 110 82 L 92 82 L 92 104 L 44 104 L 44 82 L 26 82 L 26 104 L 18 104 C 4 104 2 86 12 74 Z" fill="#e9e5ef" stroke="#b7afc6" stroke-width="2"/>
      <path d="M46 34 C 30 20 12 28 16 46 C 28 46 40 40 46 34 Z" fill="#ddd6e6"/>
      <circle cx="104" cy="52" r="3" fill="#3a3540"/><circle cx="118" cy="60" r="2.4" fill="#3a3540"/>
    </g>
    <g font-size="10.5" fill="#4a443a">
      <text x="210" y="40">· 아치형 등(roach back) + 잘록한 허리(tuck-up)</text>
      <text x="210" y="60">· 곱슬 양털 코트 · 둥근 머리 · 뾰족한 긴 주둥이</text>
      <text x="210" y="80">· 삼각 귀 끝 술장식 · 가늘고 긴 다리</text>
      <text x="210" y="100">· 파랑/라이트-리버(연회색) 톤 · 저채도</text>
      <text x="210" y="122" class="tiny">개(dog)로 즉시 읽히되 사무실 톤을 해치지 않는 크기</text>
    </g>
  </g>

  <!-- ambient pose grid -->
  <g transform="translate(40,258)">
    <text x="0" y="0" class="pl">앰비언트 포즈 (근거 없는 중립 활동 · 상태를 의미하지 않음)</text>
    <!-- pose cell helper via repeated inline shapes -->
    <!-- walk/patrol -->
    <g transform="translate(0,18)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(28,34)"><path d="M6 30 C0 16 12 6 24 9 C 27 1 44 1 47 10 C 62 10 70 22 62 32 C 68 35 66 44 58 44 L 52 44 L 54 52 L 48 52 L 46 44 L 24 44 L 20 52 L 14 52 L 16 44 L 9 44 C 2 44 1 36 6 30 Z" class="coat"/><path d="M24 9 C16 3 8 6 9 15 C 14 15 20 12 24 9Z" class="coat2"/><circle cx="52" cy="20" r="2" fill="#3a3540"/></g>
      <text x="70" y="108" text-anchor="middle" class="tiny">걷기 / 순찰</text></g>
    <!-- sniff -->
    <g transform="translate(150,18)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(28,40)"><path d="M6 30 C2 18 12 10 22 12 C 26 2 44 2 47 12 C 62 12 70 22 62 32 C 68 35 66 44 58 44 L 14 44 C 4 44 1 38 6 30 Z" class="coat"/><path d="M22 12 C 12 10 4 16 8 24 C 12 20 18 14 22 12 Z" class="coat2"/><circle cx="14" cy="30" r="2" fill="#3a3540"/><circle cx="10" cy="46" r="1.4" fill="#b9b1c6"/><circle cx="16" cy="49" r="1.2" fill="#c8c1d6"/></g>
      <text x="70" y="108" text-anchor="middle" class="tiny">킁킁 냄새</text></g>
    <!-- head tilt -->
    <g transform="translate(300,18)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(30,30)"><path d="M8 34 C2 22 12 12 24 14 C 26 4 44 4 47 14 C 62 14 70 24 62 34 C 68 37 66 46 58 46 L 14 46 C 4 46 2 42 8 34 Z" class="coat" transform="rotate(-10 35 30)"/><circle cx="50" cy="20" r="2" fill="#3a3540"/></g>
      <text x="70" y="108" text-anchor="middle" class="tiny">고개 갸웃</text></g>
    <!-- scratch/curiosity -->
    <g transform="translate(450,18)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(28,32)"><path d="M6 32 C0 18 12 8 24 11 C 27 3 44 3 47 12 C 62 12 70 22 62 32 C 68 35 66 44 58 44 L 30 44 L 30 36 L 22 44 L 9 44 C 2 44 1 40 6 32 Z" class="coat"/><line x1="24" y1="44" x2="18" y2="30" stroke="#cdc6da" stroke-width="3"/><circle cx="52" cy="21" r="2" fill="#3a3540"/></g>
      <text x="70" y="108" text-anchor="middle" class="tiny">가벼운 긁기 / 호기심</text></g>
    <!-- eat -->
    <g transform="translate(600,18)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(28,42)"><path d="M6 28 C2 16 12 8 22 10 C 26 0 44 0 47 10 C 62 10 70 20 62 30 C 68 33 66 42 58 42 L 14 42 C 4 42 1 36 6 28 Z" class="coat"/><circle cx="16" cy="26" r="2" fill="#3a3540"/></g>
      <ellipse cx="42" cy="88" rx="16" ry="5" fill="#d8b98a"/><text x="70" y="108" text-anchor="middle" class="tiny">사료 먹기</text></g>
    <!-- drink -->
    <g transform="translate(750,18)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(28,42)"><path d="M6 28 C2 16 12 8 22 10 C 26 0 44 0 47 10 C 62 10 70 20 62 30 C 68 33 66 42 58 42 L 14 42 C 4 42 1 36 6 28 Z" class="coat"/><circle cx="16" cy="26" r="2" fill="#3a3540"/></g>
      <ellipse cx="42" cy="88" rx="15" ry="5" fill="#bcd3e6"/><text x="70" y="108" text-anchor="middle" class="tiny">물 마시기</text></g>
    <!-- sleep/rest -->
    <g transform="translate(0,150)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(24,60)"><ellipse cx="46" cy="10" rx="46" ry="18" class="coat"/><path d="M6 6 C 0 0 4 -6 12 -4 C 10 2 8 6 6 6 Z" class="coat2"/><circle cx="12" cy="6" r="1.6" fill="#3a3540"/></g>
      <text x="70" y="30" class="tiny">z z</text><text x="70" y="108" text-anchor="middle" class="tiny">수면 / 휴식</text></g>
    <!-- affectionate -->
    <g transform="translate(150,150)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(30,30)"><path d="M8 34 C2 22 12 12 24 14 C 26 4 44 4 47 14 C 62 14 70 24 62 34 C 68 37 66 46 58 46 L 14 46 C 4 46 2 42 8 34 Z" class="coat"/><circle cx="50" cy="22" r="2" fill="#3a3540"/><path d="M62 20 q 6 -8 12 0" fill="none" stroke="#c99" stroke-width="2"/></g>
      <text x="90" y="40" class="tiny">♥</text><text x="70" y="108" text-anchor="middle" class="tiny">애정 표현</text></g>
    <!-- neutral idle (unknown) -->
    <g transform="translate(300,150)"><rect width="140" height="118" rx="10" fill="#fff" stroke="#e0d8c8"/>
      <g transform="translate(30,36)"><path d="M6 30 C0 16 12 6 24 9 C 27 1 44 1 47 10 C 62 10 70 22 62 32 C 68 35 66 44 58 44 L 52 44 L 52 34 L 44 34 L 44 44 L 22 44 L 22 34 L 14 34 L 14 44 L 9 44 C 2 44 1 36 6 30 Z" class="coat"/><circle cx="52" cy="20" r="2" fill="#3a3540"/></g>
      <text x="70" y="108" text-anchor="middle" class="tiny">중립 대기 (기본)</text></g>
    <!-- placement note cell -->
    <g transform="translate(450,150)"><rect width="290" height="118" rx="10" fill="#fbeae6" stroke="#e6c2b6"/>
      <text x="14" y="24" class="warn">Channy는 권한이 없다 (비운영)</text>
      <g font-size="10" fill="#7a5248"><text x="14" y="46">· 인터럽트 분류·tmux 입력·continue/retry/recover 불가</text><text x="14" y="64">· 승인·용량/과금/자격/DB/프로덕션/Git 리스크 처리 불가</text><text x="14" y="82">· 주변부 배치 · 데스크/워크스테이션 점유 안 함</text><text x="14" y="100">· 감속 모션 시 정지 · 앰비언트는 상태를 의미하지 않음</text></g>
    </g>
  </g>

  <text x="28" y="602" class="cap">배치: 공용 층의 조용한 주변부(복도/화분 옆). 스케일: 무릎 높이(~1.2 타일). 포즈는 상태 애니메이션이 아니며 어떤 운영 사실도 표현하지 않는다.</text>
</svg>
